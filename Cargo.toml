[package]
name = "kobold-governance"
version = "0.1.0"
edition = "2021"
description = "Copybook schema-migration governance: diff two copybook layout versions, classify per-field drift (added/removed/resized/retyped/moved/reordered), and emit a fail-closed on-disk-layout compatibility verdict."
authors = ["infinityabundance"]
license = "Apache-2.0"
repository = "https://github.com/infinityabundance/kobold-governance"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
