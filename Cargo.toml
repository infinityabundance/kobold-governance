[package]
name = "kobold-governance"
version = "0.1.0"
edition = "2021"
description = "Schema and migration governance: copybook version lineage, field-drift detection, layout-compatibility reports, schema-migration contracts, dataset custody chain, and change-impact analysis."
authors = ["infinityabundance"]
license = "Apache-2.0"
repository = "https://github.com/infinityabundance/kobold-governance"
readme = "README.md"
publish = false  # empty scaffold; flip to publishable once the implementation lands

[dependencies]
# Dependency rule: kobold-* MAY depend on gnucobol-rs; gnucobol-rs MUST NOT depend on kobold-*.
# Activate when the implementation is extracted, e.g.: gnucobol-rs = "0.7"
